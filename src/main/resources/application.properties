# Database Configuration (Local - No Docker)
# Update these values to match your local PostgreSQL setup
db.url=jdbc:postgresql://localhost:5432/esalle_ensaa
db.username=postgres
db.password=Bac14.83
db.driver=org.postgresql.Driver

# Hibernate Configuration
hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
hibernate.hbm2ddl.auto=update
hibernate.show_sql=true
hibernate.format_sql=true

# Application Configuration
app.name=E-Salle ENSAA
app.version=1.0.0
app.encoding=UTF-8

# Pagination Configuration
pagination.default.size=10
pagination.max.size=100

# File Upload Configuration
upload.max.size=10485760
upload.allowed.types=jpg,jpeg,png,pdf,doc,docx

# Logging Configuration
logging.level.root=INFO
logging.level.com.esalle=DEBUG
logging.pattern=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n
