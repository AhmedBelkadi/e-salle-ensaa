# Docker Compose file for E-Salle ENSAA

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: esalle-postgres
    environment:
      POSTGRES_DB: esalle_ensaa
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --lc-collate=C --lc-ctype=C"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./src/main/resources/db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
    ports:
      - "5432:5432"
    networks:
      - esalle-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d esalle_ensaa"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # E-Salle Application
  webapp:
    build: .
    container_name: esalle-webapp
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/esalle_ensaa
      DB_USERNAME: postgres
      DB_PASSWORD: password
      JAVA_OPTS: "-Xmx512m -Xms256m -Dspring.profiles.active=docker"
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - esalle-network
    volumes:
      - ./logs:/usr/local/tomcat/logs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # Nginx Reverse Proxy (Optional)
  nginx:
    image: nginx:alpine
    container_name: esalle-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./docker/nginx/conf.d:/etc/nginx/conf.d
      - ./docker/ssl:/etc/nginx/ssl
    depends_on:
      - webapp
    networks:
      - esalle-network
    restart: unless-stopped


volumes:
  postgres_data:
    driver: local


networks:
  esalle-network:
    driver: bridge
