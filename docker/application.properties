# E-Salle ENSAA Application Properties for Docker

# Database Configuration
db.url=jdbc:postgresql://postgres:5432/esalle_ensaa
db.username=postgres
db.password=password
db.driver=org.postgresql.Driver

# Hibernate Configuration
hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
hibernate.hbm2ddl.auto=update
hibernate.show_sql=true
hibernate.format_sql=true
hibernate.current_session_context_class=thread

# Connection Pool Settings
hibernate.c3p0.min_size=5
hibernate.c3p0.max_size=20
hibernate.c3p0.acquire_increment=1
hibernate.c3p0.timeout=300
hibernate.c3p0.max_statements=50

# Application Settings
app.name=E-Salle ENSAA
app.version=1.0.0
app.environment=docker

# Logging Configuration
logging.level.com.esalle=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# Security Settings
security.cors.allowed.origins=*
security.cors.allowed.methods=GET,POST,PUT,DELETE,OPTIONS
security.cors.allowed.headers=Content-Type,Authorization,X-Requested-With

# Cache Settings
cache.enabled=true
cache.ttl=3600

# File Upload Settings
upload.max.file.size=10MB
upload.allowed.types=jpg,jpeg,png,gif,pdf,doc,docx

# Email Settings (if needed)
email.smtp.host=localhost
email.smtp.port=587
email.smtp.username=
email.smtp.password=
email.from=noreply@esalle-ensaa.com
