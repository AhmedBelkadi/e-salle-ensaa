# For JBoss Logging
org.apache.juli.logging.ConsoleHandler.level = INFO
org.apache.juli.logging.ConsoleHandler.formatter = java.util.logging.SimpleFormatter

# For E-Salle Application
com.esalle.level = INFO
com.esalle.handlers = org.apache.juli.logging.ConsoleHandler

# Root logger
.level = INFO
.handlers = org.apache.juli.logging.ConsoleHandler

# Application specific loggers
com.esalle.features.salle.level = DEBUG
com.esalle.shared.level = INFO
com.esalle.core.level = INFO

# Hibernate logging
org.hibernate.SQL.level = DEBUG
org.hibernate.type.descriptor.sql.BasicBinder.level = TRACE
org.hibernate.engine.transaction.level = DEBUG

# Database connection logging
org.apache.tomcat.jdbc.level = INFO
